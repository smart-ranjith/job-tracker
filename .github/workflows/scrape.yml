name: Daily Job Scraper

on:
  schedule:
    - cron: '0 3 * * *'   # runs every day at 3AM UTC (8:30AM IST)
  workflow_dispatch:        # also allows manual trigger anytime

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated jobs data
        run: |
          git config --global user.name "job-bot"
          git config --global user.email "job-bot@github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update jobs $(date +'%Y-%m-%d')"
          git push
